# Default configuration values
# These are the base values that can be overridden by environment-specific configs

app_name: pantstack
api_version: v1
api_prefix: /api
log_level: INFO

# Security defaults
jwt_algorithm: HS256
jwt_expiration_hours: 24
rate_limit: 100

# CORS settings
cors_origins:
  - http://localhost:3000
  - http://localhost:8000

# Redis defaults
redis:
  host: localhost
  port: 6379
  db: 0
  socket_timeout: 5
  connection_pool_max_connections: 50

# Celery defaults
celery:
  task_serializer: json
  result_serializer: json
  accept_content:
    - json
  timezone: UTC
  enable_utc: true
  task_track_started: true
  task_time_limit: 300
  task_soft_time_limit: 240
  worker_prefetch_multiplier: 4
  worker_max_tasks_per_child: 1000

# AWS defaults
aws:
  region: us-east-1
  localstack_enabled: false
  localstack_endpoint: http://localhost:4566

# Database defaults
database:
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  statement_timeout: 30000
  lock_timeout: 10000